name: Release AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/transmission-ui/package-lock.json

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-0 \
            libgtk-3-dev \
            librsvg2-bin \
            patchelf \
            pkg-config \
            file

      - name: Build AppImage
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || format('build-{0}', github.run_number) }}
        run: |
          VERSION="${RAW_VERSION#v}"
          export VERSION
          export OUTPUT_NAME="TransmissionNET-${VERSION}-x86_64.AppImage"
          ./packaging/appimage/build-appimage.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransmissionNET-x86_64.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
